@if (visible()) {
<div class="fixed inset-0 z-[60] flex items-end justify-center sm:items-center" (keydown.escape)="onCancel()">
    <div class="absolute inset-0 bg-brand-black/60" (click)="onCancel()" aria-hidden="true"></div>

    <div class="relative w-full max-w-md bg-brand-white p-6 sm:mx-4 sm:rounded-md animate-modal-in"
        [class.modal-top-danger]="variant() === 'destructive'" [class.modal-top-confirm]="variant() === 'confirm'"
        role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title"
        aria-describedby="confirm-modal-message">
        <h2 id="confirm-modal-title" class="text-2xl">{{ title() }}</h2>
        <p id="confirm-modal-message" class="mt-3 text-brand-gray leading-relaxed">{{ message() }}</p>

        <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            <button type="button" (click)="onCancel()" class="btn btn--ghost">
                Cancelar
            </button>
            @if (variant() === 'destructive') {
            <button type="button" (click)="onConfirm()" class="btn btn--danger">
                {{ confirmText() }}
            </button>
            } @else {
            <button type="button" (click)="onConfirm()" class="btn btn--dark">
                {{ confirmText() }}
            </button>
            }
        </div>
    </div>
</div>
}
